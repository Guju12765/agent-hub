  <!-- Robot eyes -->
  <circle cx="14" cy="22" r="3" fill="white"/>
  <circle cx="26" cy="22" r="3" fill="white"/>
  <!-- Robot antenna -->
  <line x1="20" y1="10" x2="20" y2="4" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="20" cy="4" r="3" fill="#3b82f6"/>
  <!-- Robot mouth -->
  <rect x="12" y="30" width="16" height="3" rx="1" fill="white"/>
</svg>
