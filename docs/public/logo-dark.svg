<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <!-- Robot head -->
  <rect x="5" y="8" width="30" height="30" rx="4" fill="#60a5fa"/>
  <!-- Robot eyes -->
  <circle cx="14" cy="20" r="3" fill="white"/>
  <circle cx="26" cy="20" r="3" fill="white"/>
  <!-- Robot antenna -->
  <line x1="20" y1="8" x2="20" y2="2" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="20" cy="2" r="2" fill="#60a5fa"/>
  <!-- Robot mouth -->
  <rect x="12" y="28" width="16" height="3" rx="1" fill="white"/>
  <!-- Text -->
  <text x="45" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#f1f5f9">Agent Hub</text>
</svg>
